name: Update Sketchnote Manifest

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Manifest Script
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function getHtmlFiles(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir)
                  .filter(file => file.endsWith(".html"));
          }

          const manifest = {
              weekly: getHtmlFiles("html/weekly"),
              monthly: getHtmlFiles("html/monthly"),
              shortnotes: []
          };

          const shortnotesDir = "html/Shortnotes";
          if (fs.existsSync(shortnotesDir)) {
              fs.readdirSync(shortnotesDir, { withFileTypes: true }).forEach(dirent => {
                  if (dirent.isDirectory()) {
                      const subject = dirent.name;
                      const files = getHtmlFiles(path.join(shortnotesDir, subject));
                      files.forEach(f => {
                          manifest.shortnotes.push({ subject: subject, filename: f });
                      });
                  }
              });
          }

          fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || (git commit -m "chore: auto-update manifest.json [skip ci]" && git push)
