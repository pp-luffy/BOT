name: 🎲 Standalone Quiz Bot

# NEW: This queues requests so they run one by one, preventing Git collisions.
concurrency: 
  group: bot-queue
  cancel-in-progress: false

on:
  repository_dispatch:
    types: [trigger-agent]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Topic for the quiz'
        required: true
        type: string
# ... rest of the file remains exactly the same ...

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- 🎲 RUN QUIZ GENERATOR ---
      - name: Run Quiz Generator
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          USER_SECRETS_JSON: ${{ secrets.USER_SECRETS_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXAM_NAME: ${{ secrets.EXAM_NAME || 'Competitive Examination' }}
          INCOMING_CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.client_payload.telegram_chat_id || github.event.inputs.chat_id }}
          USER_REQUEST: ${{ github.event.client_payload.message || github.event.client_payload.text || github.event.client_payload.prompt || github.event.inputs.prompt }}
        run: python backup.py

      # --- 💾 UNIVERSAL USAGE TRACKER SAVE ---
      - name: Save Daily Tracker
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 1. Add and commit the new data FIRST
          git add -f usage_tracker.json
          git commit -m "chore: update API usage tracker [skip ci]" || echo "No usage changes to commit"
          
          # 2. THEN pull any new changes from the repository
          git pull --rebase origin ${{ github.ref_name }} || true
          
          # 3. FINALLY, push back to GitHub
          git push origin HEAD:${{ github.ref_name }}
