name: 🎲 Standalone Quiz Bot

on:
  repository_dispatch:
    types: [trigger-agent]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Topic for the quiz'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        type: string

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # NOTE: Dependency step removed entirely! Python script now runs natively.

      # --- 🎲 RUN QUIZ GENERATOR (WITH BUILT-IN AUTH GATE) ---
      - name: Run Quiz Generator
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXAM_NAME: ${{ secrets.EXAM_NAME || 'Competitive Examination' }}
          INCOMING_CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.client_payload.telegram_chat_id || github.event.inputs.chat_id }}
          USER_REQUEST: ${{ github.event.client_payload.message || github.event.client_payload.text || github.event.client_payload.prompt || github.event.inputs.prompt }}
        run: python quiz_bot.py

      # --- 💾 UNIVERSAL USAGE TRACKER SAVE ---
      - name: Save Daily Tracker
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin ${{ github.ref_name }} || true 
          git add -f usage_tracker.json
          git commit -m "chore: update API usage tracker [skip ci]" || echo "No usage changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      # --- 🧹 FLUSH & RESET WEBHOOK ---
      - name: Reset Webhook
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/deleteWebhook?drop_pending_updates=true"
          sleep 2
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setWebhook?url=${WEBHOOK_URL}"
